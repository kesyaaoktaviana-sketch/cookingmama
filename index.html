<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Tangkap Kotak</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
      padding: 20px;
    }
    h1 { margin-top: 10px; }
    p { opacity: 0.95; }
    .panel {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin: 16px 0;
    }
    .card {
      background: #1f2937;
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid #374151;
      min-width: 110px;
    }
    button {
      background: #22c55e;
      color: white;
      border: none;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    #gameArea {
      position: relative;
      width: min(92vw, 360px);
      height: 420px;
      margin: 20px auto;
      background: linear-gradient(180deg, #1f2937, #111827);
      border: 3px solid #38bdf8;
      border-radius: 16px;
      overflow: hidden;
    }
    #target {
      position: absolute;
      width: 70px;
      height: 70px;
      background: #f43f5e;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      user-select: none;
      touch-action: none;
      box-shadow: 0 10px 20px rgba(244, 63, 94, 0.35);
    }
    .hidden { display: none; }
    #message {
      min-height: 24px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Game Tangkap Kotak</h1>
  <p>Tekan <b>Start Game</b>, lalu sentuh kotak merah sebanyak mungkin dalam 30 detik.</p>

  <div class="panel">
    <div class="card">Skor: <span id="score">0</span></div>
    <div class="card">Waktu: <span id="time">30</span></div>
  </div>

  <button id="startBtn">Start Game</button>

  <div id="gameArea">
    <div id="target" class="hidden">TAP</div>
  </div>

  <p id="message">Siap bermain?</p>

  <script>
    const scoreEl = document.getElementById("score");
    const timeEl = document.getElementById("time");
    const messageEl = document.getElementById("message");
    const startBtn = document.getElementById("startBtn");
    const gameArea = document.getElementById("gameArea");
    const target = document.getElementById("target");

    let score = 0;
    let timeLeft = 30;
    let moveInterval = null;
    let timerInterval = null;
    let playing = false;

    function updateUI() {
      scoreEl.textContent = score;
      timeEl.textContent = timeLeft;
    }

    function placeTarget() {
      const targetSize = 70;
      const maxX = gameArea.clientWidth - targetSize;
      const maxY = gameArea.clientHeight - targetSize;

      const x = Math.floor(Math.random() * (maxX + 1));
      const y = Math.floor(Math.random() * (maxY + 1));

      target.style.left = x + "px";
      target.style.top = y + "px";
    }

    function startGame() {
      clearInterval(moveInterval);
      clearInterval(timerInterval);

      score = 0;
      timeLeft = 30;
      playing = true;
      updateUI();

      messageEl.textContent = "Ayo, tap kotaknya!";
      startBtn.textContent = "Ulangi Game";
      target.classList.remove("hidden");
      placeTarget();

      moveInterval = setInterval(placeTarget, 700);

      timerInterval = setInterval(() => {
        timeLeft--;
        updateUI();

        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      playing = false;
      clearInterval(moveInterval);
      clearInterval(timerInterval);
      target.classList.add("hidden");

      let hasil = "Waktu habis! Skor akhir kamu: " + score + ".";
      if (score >= 25) {
        hasil += " Hebat sekali!";
      } else if (score >= 15) {
        hasil += " Bagus!";
      } else {
        hasil += " Coba lagi ya!";
      }

      messageEl.textContent = hasil;
    }

    function hitTarget(event) {
      event.preventDefault();
      if (!playing) return;

      score++;
      updateUI();
      placeTarget();
    }

    startBtn.addEventListener("click", startGame);
    target.addEventListener("pointerdown", hitTarget);

    updateUI();
  </script>
</body>
</html>
